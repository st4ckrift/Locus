
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-explorer"
version = "0.2.0"
description = "A local-first, context-aware file search engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
semantic = ["sentence-transformers>=3.0"]

[project.scripts]
smartfiles = "smartfiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

