
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locus"
version = "0.3.0"
description = "A local-first, context-aware file search engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

semantic = [
    "sentence-transformers>=3.0",
]

api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
locus = "locus.cli:main"
locusd = "locus.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

